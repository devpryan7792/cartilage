name: Validate Recipes & Schema

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Compilation & Imports
        run: |
          python3 -m py_compile src/cartilage/*.py
          python3 -c "import sys, cartilage; from cartilage import cli, builder, composer, flasher, runner, schema, yaml; print('All Cartilage modules imported successfully on Python ' + sys.version)"

      - name: Validate Recipe Manifests
        run: |
          chmod +x ./cartilage
          ./cartilage validate recipes/*.yaml recipes/experimental/*.yaml
