# Cartilage OS - Dynamic Hub Appliance mkinitcpio Configuration
# Ensures exfat, erofs, loop, virtio, and hub loader are baked into early userspace.

MODULES=(erofs exfat loop ext4 virtio_blk virtio_pci virtio_gpu virtio_dma_buf overlay zram zstd)
BINARIES=(blkid)
FILES=()
HOOKS=(base udev modconf block cartilage_hub filesystems)
COMPRESSION="zstd"
