appliance:
  name: mousepad
  version: "1.0.0"
  description: "Focused Text Editor Workstation"
  author: "Cartilage Project"

runtime:
  engine: arch
  packages:
    - mousepad
    - cage
    - seatd
  environment:
    XDG_CURRENT_DESKTOP: Wayland

display:
  compositor: cage
  mode: desktop
  entrypoint: /usr/bin/mousepad
  args: []

storage:
  mode: persistent
  quota: 256M
  mount_point: /data

hardware:
  network: false
  audio: false
  acceleration: auto
  memory: 1024M
  cores: 2
