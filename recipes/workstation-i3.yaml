appliance:
  name: workstation-i3
  version: 1.0.0
  description: i3-Compatible Developer Workstation (Foot + Browser on Sway)
  author: Cartilage OS Project

runtime:
  engine: arch
  packages:
    - foot
    - dillo
    - sway
    - wlroots0.20
    - libinput
    - cairo
    - pango
    - xcb-util-wm
  environment:
    TERM: foot
    GDK_BACKEND: wayland,x11

display:
  compositor: sway
  mode: desktop
  entrypoint: /usr/bin/sway

storage:
  mode: persistent
  quota: 512M

hardware:
  memory: 1024M
  cores: 2
  network: true
  audio: true
