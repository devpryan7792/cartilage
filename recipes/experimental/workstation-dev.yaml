appliance:
  name: workstation-dev
  version: 1.0.0
  description: Developer Workstation Duo (Foot Terminal + Web Browser on Labwc)
  author: Cartilage OS Project

runtime:
  engine: arch
  packages:
    - foot
    - dillo
    - labwc
    - libsfdo
    - wlroots0.20
  environment:
    TERM: foot
    GDK_BACKEND: wayland,x11

display:
  compositor: labwc
  mode: desktop
  entrypoint: /usr/bin/labwc

storage:
  mode: persistent
  quota: 512M

hardware:
  memory: 1024M
  cores: 2
  network: true
  audio: true
