appliance:
  name: dillo
  version: "1.0.0"
  description: "Lightweight Web Browser"
  author: "Cartilage Project"

runtime:
  engine: arch
  packages:
    - dillo
    - cage
    - seatd
    - xorg-xwayland
  environment:
    XDG_CURRENT_DESKTOP: Wayland

display:
  compositor: cage
  mode: desktop
  entrypoint: /usr/bin/dillo
  args:
    - "https://duckduckgo.com"

storage:
  mode: ephemeral
  quota: 256M
  mount_point: /data

hardware:
  network: true
  audio: false
  acceleration: auto
  memory: 1024M
  cores: 2
